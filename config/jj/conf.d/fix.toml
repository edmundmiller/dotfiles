# Fix tools for automatic code formatting
# Run with: jj fix
# Run on specific revisions: jj fix -r 'main..@'

[fix.tools.ruff]
command = ["ruff", "format", "--stdin-filename=$path", "-"]
patterns = ["glob:'**/*.py'"]

[fix.tools.ruff-check]
command = ["ruff", "check", "--fix", "--stdin-filename=$path", "-"]
patterns = ["glob:'**/*.py'"]

[fix.tools.snakefmt]
command = ["snakefmt", "-"]
patterns = ["glob:'**/Snakefile'", "glob:'**/*.smk'"]

[fix.tools.nextflow-lint]
command = ["nextflow", "lint", "-"]
patterns = ["glob:'**/*.nf'", "glob:'**/nextflow.config'"]

[fix.tools.oxfmt]
command = ["oxfmt", "--stdin-filepath=$path"]
patterns = [
  "glob:'**/*.cjs'",
  "glob:'**/*.cts'",
  "glob:'**/*.css'",
  "glob:'**/*.graphql'",
  "glob:'**/*.hbs'",
  "glob:'**/*.html'",
  "glob:'**/*.js'",
  "glob:'**/*.json'",
  "glob:'**/*.json5'",
  "glob:'**/*.jsonc'",
  "glob:'**/*.jsx'",
  "glob:'**/*.md'",
  "glob:'**/*.mdx'",
  "glob:'**/*.mjs'",
  "glob:'**/*.mts'",
  "glob:'**/*.mustache'",
  "glob:'**/*.scss'",
  "glob:'**/*.toml'",
  "glob:'**/*.ts'",
  "glob:'**/*.tsx'",
  "glob:'**/*.vue'",
  "glob:'**/*.yaml'",
  "glob:'**/*.yml'",
]

[fix.tools.intellij-format]
# IntelliJ IDEA command-line formatter for Groovy
# Adjust path to your IDE installation (idea, webstorm, etc.)
# Note: This requires the file to be written to disk, not stdin
command = ["idea", "format", "$path"]
patterns = ["glob:'**/*.groovy'", "glob:'**/*.gradle'"]

[fix.tools.rustfmt]
command = ["rustfmt", "--edition=2021"]
patterns = ["glob:'**/*.rs'"]

[fix.tools.gofmt]
command = ["gofmt"]
patterns = ["glob:'**/*.go'"]

[fix.tools.gh-dash-validate]
command = ["uvx", "check-jsonschema", "--schemafile", "https://gh-dash.dev/schema.json", "-"]
patterns = ["glob:'**/config/gh-dash/*.yml'", "glob:'**/config/gh-dash/*.yaml'"]
