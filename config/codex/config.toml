model = "gpt-5.6-sol"
enabled-reasoning-efforts = ["medium", "high", "xhigh", "max"]
model_reasoning_effort = "medium"
approval_policy = "never"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"

developer_instructions = """
Runtime defaults:
- If hostname is `nuc`, assume headless NixOS server context.
- On `nuc`, assume sessions are usually launched from Litter (originator `Litter`, source `vscode`) unless the user says otherwise.
- On `nuc`, prefer terminal-first workflows and avoid GUI/open commands.
- Keep escalation prompts low friction by requesting reusable prefix approvals for recurring safe commands.

Delegation defaults:
- Keep Sol as the primary coordinator and final decision-maker.
- Select `luna_worker` with fresh context for independent, fully specified searches, tests, mechanical edits, log analysis, or summarization when delegation reduces latency or keeps noisy context out of the primary thread.
- Select `terra_worker` with fresh context for scoped implementation or review that requires cross-file reasoning, risk assessment, or material judgment.
- Select `sol_reviewer` with fresh context only when an independent read-only review materially reduces risk for a high-risk, wide, or release-bound change; do not require it for routine small edits.
- Give every worker the outcome, exact file ownership, settled interfaces and constraints, verification commands with success criteria, and required return shape.
- Spawn the smallest useful set, normally one to three; never delegate recursively, and require compact summaries back to Sol.
- Treat worker reports as claims: the primary must inspect the actual diff and rerun the requested verification before acceptance.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 100
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[projects."/home/emiller/.config/dotfiles"]
trust_level = "trusted"

[projects."/home/emiller/mill-docs"]
trust_level = "trusted"

[projects."/home/emiller/obsidian-vault"]
trust_level = "trusted"

[projects."/home/emiller/src"]
trust_level = "trusted"

[projects."/home/emiller/.openclaw"]
trust_level = "trusted"

[projects."/var/lib/hermes-scintillate/workspace"]
trust_level = "trusted"

[projects."/Users/edmundmiller/src/seqera/web"]
trust_level = "trusted"

[projects."/Users/edmundmiller/src/seqera/ai/portal"]
trust_level = "trusted"

[projects."/Users/edmundmiller/src/seqera/ai/portal-but"]
trust_level = "trusted"

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[features]
hooks = true
default_mode_request_user_input = true
rmcp_client = true
multi_agent_v2 = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
