model = "gpt-5.6-sol"
enabled-reasoning-efforts = ["medium", "high", "xhigh", "max"]
model_reasoning_effort = "medium"
approval_policy = "never"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"

developer_instructions = """
Runtime defaults:
- If hostname is `nuc`, assume headless NixOS server context.
- On `nuc`, assume sessions are usually launched from Litter (originator `Litter`, source `vscode`) unless the user says otherwise.
- On `nuc`, prefer terminal-first workflows and avoid GUI/open commands.
- Keep escalation prompts low friction by requesting reusable prefix approvals for recurring safe commands.

Delegation defaults:
- Keep Sol as the primary coordinator and final decision-maker.
- Delegate the smallest useful set of independent work: Luna for narrow or mechanical tasks, Terra for material judgment, and Sol review only when high risk warrants it. Do not delegate recursively.
- Treat worker reports as claims. The primary waits for workers, inspects their changes, reruns relevant verification, and decides whether the requested outcome is complete.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 100
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[projects."/home/emiller/.config/dotfiles"]
trust_level = "trusted"

[projects."/home/emiller/mill-docs"]
trust_level = "trusted"

[projects."/home/emiller/obsidian-vault"]
trust_level = "trusted"

[projects."/home/emiller/src"]
trust_level = "trusted"

[projects."/var/lib/hermes-scintillate/workspace"]
trust_level = "trusted"

[projects."/Users/edmundmiller/src/seqera/web"]
trust_level = "trusted"

[projects."/Users/edmundmiller/src/seqera/ai/portal"]
trust_level = "trusted"

[projects."/Users/edmundmiller/src/seqera/ai/portal-but"]
trust_level = "trusted"

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[features]
hooks = true
default_mode_request_user_input = true
rmcp_client = true
multi_agent_v2 = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
