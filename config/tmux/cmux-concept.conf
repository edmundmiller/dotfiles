# cmux-inspired tmux workflow (optional snippet)
#
# Source manually to try it:
#   tmux source-file ~/.config/tmux/cmux-concept.conf
#
# This file is intentionally conservative and tmux-native.

##### Workspace organization + navigation

# Fast workspace tree (sessions/windows/panes)
bind-key w choose-tree -Zw

# Toggle to previous workspace/window
bind-key C-] last-window

# Create canonical workspace windows quickly in current session
# (safe: only creates missing windows)
bind-key C-o run-shell 'for w in code test logs ops; do tmux list-windows -F "#{window_name}" | grep -qx "$w" || tmux new-window -n "$w" -c "#{pane_current_path}"; done'

##### Surface habits (no native surface in tmux)

# Scratch popup shell (temporary surface)
bind-key C-g display-popup -E -w 88% -h 82% -d "#{pane_current_path}" "$SHELL"

# Git popup surface
bind-key C-f display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit"

# Zoom pane as focused surface
bind-key C-z resize-pane -Z

##### Notification flow

set -g monitor-activity on
set -g visual-activity on
set -g bell-action any
set -g visual-bell on
setw -g monitor-silence 45
set -g silence-action any

# Optional: passthrough for nested terminal stacks (tmux inside cmux/kitty/ghostty)
set -g allow-passthrough on
