web_search:
  enabled: true
symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light-catppuccin-readable
colorBlindMode: false
statusLine:
  preset: compact
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true

terminal:
  showProgress: true

bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: true
shellMinimizer:
  sourceOutlineLevel: aggressive

tui:
  renderMermaid: true
  hyperlinks: auto
  tight: true

display:
  shimmer: kitt
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
showHardwareCursor: true
defaultThinkingLevel: low
hideThinkingBlock: true
proseOnlyThinking: true
omitThinking: false
eval:
  jl: true

model:
  loopGuard:
    enabled: true
    checkAssistantContent: true
    toolCallReminder: true
  toolCallLoopGuard:
    enabled: true
compaction:
  strategy: context-full
  thresholdPercent: 70
  supersedeReads: true
  dropUseless: true
  autoContinue: true
  keepRecentTokens: 20000
  idleEnabled: true
  idleThresholdTokens: 100000
  idleTimeoutSeconds: 300
snapcompact:
  systemPrompt: none
  toolResults: false
# omp 18 gates onboarding steps behind setupVersion: a scene runs when its
# minVersion exceeds this number, and omp then writes the new value back. That
# write cannot land here -- ~/.omp/agent/config.yml is a read-only Nix store
# symlink -- so any unsatisfied scene re-runs on every launch and the handoff
# drops to the shell. Pin this at or above the highest scene minVersion
# (composer-shape is 2; glyph-mode/model/providers/theme are 1) and set the
# values those scenes would ask for. Re-check after an omp major bump with:
#   strings -a $(readlink -f $(command -v omp)) | grep -B2 minVersion
setupVersion: 2
composer:
  # Accent Rail: filled one-row field with a single left accent mark. Pairs
  # with statusLine.sessionAccent and avoids the heavy end caps of `field`
  # competing with the powerline-thin separator. Alternatives: box (upstream
  # default), claude, pi, borderless, rule, field.
  shape: rail
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  smol: xai-oauth/grok-composer-2.5-fast
  slow: openai-codex/gpt-5.6-sol:xhigh
  plan: vibeproxy/claude-opus-5:high
textVerbosity: low
personality: pragmatic
steeringMode: all
followUpMode: one-at-a-time
interruptMode: wait

ttsr:
  enabled: true
  contextMode: discard
  interruptMode: always
  repeatMode: once
  builtinRules: true

prewalk:
  enabled: true

loop:
  mode: compact
doubleEscapeAction: tree
treeFilterMode: no-tools
autocompleteMaxVisible: 7
emojiAutocomplete: true

completion:
  notify: on

ask:
  timeout: 60
  notify: on

recap:
  enabled: true
  idleSeconds: 240
inspect_image:
  enabled: true
astGrep:
  enabled: true

skills:
  # /green (bundled ci-green command) already covers autonomous CI fixing:
  # watch HEAD -> fix -> push -> re-watch until green. Hidden from OMP only;
  # still deployed to Codex/hermes/opencode/pi via skills/flake.nix.
  ignoredSkills:
    - gh-fix-ci
    # Claude plugin-dev authoring skills compete with OMP's native plugin and
    # command surfaces. Keep the explicit plugin commands, hide auto-routing.
    - agent-development
    - command-development
    - hook-development
    - mcp-integration
    - plugin-settings
    - plugin-structure
    - skill-development
checkpoint:
  enabled: true
vault:
  enabled: true
github:
  enabled: true

tools:
  artifactSpillThreshold: 50
  artifactTailBytes: 20

grep:
  contextBefore: 1
  contextAfter: 3

task:
  isolation:
    mode: auto
    merge: branch
    commits: ai

features:
  unexpectedStopDetection: true

secrets:
  enabled: true
extensions:
  - ~/.omp/agent/extensions/lazy-agent-browser.mjs
  - ~/.omp/agent/extensions/lazy-plannotator.mjs
  - ~/.omp/agent/extensions/permission-policy-guard/hooks/pre/protect-permission-policy.js
disabledExtensions:
  - extension-module:agent-browser
  - extension-module:pi-extension
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  noEmbeddings: false
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true

autolearn:
  enabled: true
  autoContinue: false

branchSummary:
  enabled: true
advisor:
  enabled: true
  syncBacklog: "3"
tier:
  advisor: inherit

retry:
  maxRetries: 10
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    slow:
      - openai-codex/gpt-5.6-terra:high
      - openai-codex/gpt-5.6-luna:high
