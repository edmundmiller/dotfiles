# Suspend after 15 minutes of user inactivity. Omarchy's Quickshell service
# owns the earlier screensaver and lock timers. Its Stay Awake control writes
# the state marker checked here, so it also suppresses automatic suspend.
general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    # Work around stalled lock-screen rendering after resume (Hyprland #16105).
    # One delayed reload; reapplies monitor rules and may briefly flash displays.
    # Journal only hook activity and dispatcher output, never keyboard events.
    after_sleep_cmd = logger -t omarchy-resume-render 'resume hook started'; sleep 1 && hyprctl dispatch 'hl.dsp.force_renderer_reload()' 2>&1 | systemd-cat -t omarchy-resume-render
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
    condition_cmd = test ! -e "$HOME/.local/state/omarchy/indicators/stay-awake"
    condition_retry = 60
}
