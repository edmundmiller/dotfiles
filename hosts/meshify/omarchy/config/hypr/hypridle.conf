# Suspend after 15 minutes of user inactivity. Omarchy's Quickshell service
# owns the earlier screensaver and lock timers. Its Stay Awake control writes
# the state marker checked here, so it also suppresses automatic suspend.
general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
    condition_cmd = test ! -e "$HOME/.local/state/omarchy/indicators/stay-awake"
    condition_retry = 60
}
