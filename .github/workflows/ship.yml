name: Ship
run-name: Ship ${{ inputs.sha || github.event.workflow_run.head_sha }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: Exact main base authorized for publication
        required: true
        type: string
      sha:
        description: Exact submitted candidate SHA
        required: true
        type: string
      deploy:
        description: Explicit authority to deploy this revision to NUC
        type: boolean
        default: false
      allow_clean_rebase:
        description: Authorize up to three conflict-free replays onto descendant main with fresh CI
        type: boolean
        default: false
      deploy_rebased:
        description: Explicitly authorize deploying newer main plus the replayed task
        type: boolean
        default: false
      darwin:
        description: Require fresh hosted Darwin checks for every candidate generation
        type: boolean
        default: false
      services_vm:
        description: Require fresh hosted service VM checks for every candidate generation
        type: boolean
        default: false
      authority:
        description: Reference to the human publication and optional deployment approval
        required: true
        type: string
      owner:
        description: Owning Amp thread URL
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ship-${{ inputs.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  advance:
    if: >-
      github.repository == 'edmundmiller/dotfiles' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'candidate/'))))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DOTFILES_SHIP_TOKEN }}
      # Standing NUC rollout authority; Ship then publishes and never dispatches deployment.
      NUC_ROLLOUT: ${{ vars.NUC_ROLLOUT }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Always keep trusted main checked out, including between successor steps.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a dedicated shipping credential
        run: |
          test -n "$GH_TOKEN" || { echo '::error::DOTFILES_SHIP_TOKEN is required; shipping was not handed off.'; exit 1; }
          gh auth setup-git --hostname github.com
      - name: Register explicit dispatch authority
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir "$RUNNER_TEMP/ship-request"
          python3 scripts/ship.py register --event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/ship-request/request.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ship-request-v1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ship-request/request.json
          retention-days: 7
          if-no-files-found: error
      - name: Advance authorized shipping without waiting
        id: advance
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            args=(--record "$RUNNER_TEMP/ship-request/request.json")
          fi
          python3 scripts/ship.py advance --event "$GITHUB_EVENT_PATH" "${args[@]}" \
            --successor "$RUNNER_TEMP/ship-successor/request.json" | tee "$RUNNER_TEMP/ship-result.json"
          printf 'state=%s\n' "$(jq -er .state "$RUNNER_TEMP/ship-result.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/ship-result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.advance.outputs.state == 'rebase_prepared'
        with:
          name: ship-successor-v2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ship-successor/request.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish the authorized successor and reconcile fast CI
        if: steps.advance.outputs.state == 'rebase_prepared'
        run: |
          set -euo pipefail
          python3 scripts/ship.py publish-successor --record "$RUNNER_TEMP/ship-successor/request.json" \
            | tee "$RUNNER_TEMP/ship-successor-result.json"
          cat "$RUNNER_TEMP/ship-successor-result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain a blocked handoff
        if: failure()
        run: |
          echo '::error::Ship stopped. Inspect this run before retrying; a push or deployment dispatch may already have succeeded.'
          echo 'Ship stopped. Inspect this run and any Deploy NUC run before retrying. Do not redispatch an uncertain deployment.' >> "$GITHUB_STEP_SUMMARY"
