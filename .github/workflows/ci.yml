name: CI
run-name: ${{ inputs.ship_request && format('Ship validation {0}', inputs.ship_request) || '' }}

on:
  push:
    branches: [main, "candidate/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      darwin:
        description: Run native Darwin validation before Mac activation
        type: boolean
        default: false
      services_vm:
        description: Run the service VM suite
        type: boolean
        default: false
      ship_request:
        description: Ship validation correlation only; never grants publication or deployment authority
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  plan:
    name: Resolve validation base
    runs-on: ubuntu-26.04
    outputs:
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Validate candidate base before checks
        run: |
          VALIDATION_BASE=$(python3 scripts/candidate_ci.py base)
          printf 'base=%s\n' "$VALIDATION_BASE" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (Linux)
    needs: plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    env:
      VALIDATION_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Select public HA dependency cache
        id: public-ha-plan
        if: github.event_name == 'push' && github.repository == 'edmundmiller/dotfiles'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m scripts.ci_dependency_cache plan >> "$GITHUB_OUTPUT"
      # GitHub base-branch caches are readable by fork PRs. Never save /nix,
      # a store diff, private inputs, host configuration or check outputs here.
      - name: Restore public HA dependency archive
        id: public-ha-restore
        if: steps.public-ha-plan.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ${{ runner.temp }}/public-ha-cache
          key: public-ha-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'overlays/home-assistant-mcp-schema-compat/**') }}
      - name: Import public HA dependencies
        if: steps.public-ha-restore.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m scripts.ci_dependency_cache restore "$RUNNER_TEMP/public-ha-cache"
      - name: Bootstrap main cache from exact successful candidate
        if: steps.public-ha-plan.outputs.enabled == 'true' && steps.public-ha-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m scripts.ci_dependency_cache restore-candidate "$RUNNER_TEMP/public-ha-cache"
      - name: Restore exact successful candidate check outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m scripts.ci_check_cache restore
      - name: Validate (same runner as hey check)
        env:
          CI_CHECK_CACHE_DIR: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/candidate/') && format('{0}/empty-check-cache', runner.temp) || '' }}
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_PRIVATE_GITHUB_TOKEN }}
          REX_TOKEN: ${{ secrets.REX_TOKEN }}
        run: |
          if [[ -z "$NIX_GITHUB_TOKEN" ]]; then
            echo "::error::Configure NIX_PRIVATE_GITHUB_TOKEN with read-only access to the private tnote and agents-workspace repositories."
            exit 1
          fi
          if [[ -z "$REX_TOKEN" ]]; then
            echo "::error::Configure REX_TOKEN with access to pkgs.superlogical.com."
            exit 1
          fi
          umask 077
          rex_netrc=$(mktemp "$RUNNER_TEMP/rex-netrc.XXXXXX")
          trap 'rm -f "$rex_netrc"' EXIT
          printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_TOKEN" > "$rex_netrc"
          unset REX_TOKEN
          export NIX_CONFIG="${NIX_CONFIG:-}"$'\n'"netrc-file = $rex_netrc"
          nix shell .#validation-tools --command python3 scripts/validation.py --ci
      - name: Export only realized public HA dependencies
        id: public-ha-export
        if: steps.public-ha-plan.outputs.enabled == 'true' && steps.public-ha-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m scripts.ci_dependency_cache export "$RUNNER_TEMP/public-ha-cache" >> "$GITHUB_OUTPUT"
      - name: Save public HA dependency archive
        if: steps.public-ha-export.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/public-ha-cache
          key: public-ha-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'overlays/home-assistant-mcp-schema-compat/**') }}
      - name: Retain public dependencies for main cache bootstrap
        if: steps.public-ha-plan.outputs.enabled == 'true' && startsWith(github.ref, 'refs/heads/candidate/') && (steps.public-ha-restore.outputs.cache-hit == 'true' || steps.public-ha-export.outputs.ready == 'true')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-ha-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-ha-cache/dependencies.export
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
      - name: Retain only empty candidate check outputs
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/candidate/')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: empty-checks-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/empty-check-cache/checks.json
          retention-days: 3
          if-no-files-found: warn

  # Preserve the contexts required by main without weakening branch protection.
  required-checks:
    name: ${{ matrix.context }}
    needs: [plan, checks, darwin, vm-services]
    if: always()
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        context: [Flake Check (Linux), Check Formatting]
    steps:
      - name: Require every selected check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LINUX_RESULT: ${{ needs.checks.result }}
          DARWIN_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.darwin }}
          DARWIN_RESULT: ${{ needs.darwin.result }}
          SERVICES_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.services_vm }}
          SERVICES_RESULT: ${{ needs.vm-services.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$LINUX_RESULT" = success
          for result in "$DARWIN_REQUIRED:$DARWIN_RESULT" "$SERVICES_REQUIRED:$SERVICES_RESULT"; do
            case "$result" in
              true:success|false:skipped) ;;
              *) echo "Required check did not succeed: $result"; exit 1 ;;
            esac
          done

  darwin:
    name: Darwin-only checks
    if: github.event_name == 'workflow_dispatch' && inputs.darwin
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Prepare Xcode 27.2 Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected_app=$(realpath /Applications/Xcode_27.2.app)
          test -d "$selected_app/Contents/Developer"
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          nix shell --impure --expr "
            let pkgs = import (builtins.getFlake \"github:NixOS/nixpkgs/$nixpkgs\").outPath { };
            in { inherit (pkgs) nushell; mise = pkgs.callPackage ./.agents/mise-binary.nix { }; }
          " nushell mise --command \
            env MISE_TRUSTED_CONFIG_PATHS="$PWD" mise run xcode:setup "$selected_app" --apply
          env -u DEVELOPER_DIR /usr/bin/xcrun --no-cache --find metallib
      - name: Free space for Darwin builds
        shell: bash
        run: |
          set -euo pipefail
          selected_developer=$(realpath "$(xcode-select --print-path)")
          selected_app="${selected_developer%/Contents/Developer}"
          test -d "$selected_app/Contents/Developer"
          df -h /
          for app in /Applications/Xcode*.app; do
            if [[ ! -d "$app" || -L "$app" ]]; then
              continue
            fi
            if [[ "$(realpath "$app")" != "$selected_app" ]]; then
              printf 'Removing inactive Xcode: %s\n' "$app"
              sudo rm -rf -- "$app"
            fi
          done
          xcodebuild -version
          df -h /
      - name: Verify Metal discovery as a Nix build user
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs --expr "$(cat <<'NIX'
          builtins.derivation {
            name = "darwin-metal-toolchain-preflight";
            system = "aarch64-darwin";
            builder = "/bin/bash";
            __noChroot = true;
            preferLocalBuild = true;
            allowSubstitutes = false;
            args = [ "-euc" ''
              /usr/bin/id
              export DEVELOPER_DIR="$(/usr/bin/xcode-select -p)"
              /usr/bin/xcodebuild -showComponent MetalToolchain
              export SDKROOT="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
              for tool in swiftc metal metallib; do
                /usr/bin/xcrun --find "$tool"
              done
              /usr/bin/xcrun metal --version
              /usr/bin/touch "$out"
            '' ];
          }
          NIX
          )"
      - name: Validate native Darwin configuration
        env:
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_PRIVATE_GITHUB_TOKEN }}
          REX_TOKEN: ${{ secrets.REX_TOKEN }}
        run: |
          if [[ -z "$NIX_GITHUB_TOKEN" ]]; then
            echo "::error::Configure NIX_PRIVATE_GITHUB_TOKEN with read-only access to the private tnote and agents-workspace repositories."
            exit 1
          fi
          if [[ -z "$REX_TOKEN" ]]; then
            echo "::error::Configure REX_TOKEN with access to pkgs.superlogical.com."
            exit 1
          fi
          umask 077
          rex_netrc=$(mktemp "$RUNNER_TEMP/rex-netrc.XXXXXX")
          trap 'rm -f "$rex_netrc"' EXIT
          printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_TOKEN" > "$rex_netrc"
          unset REX_TOKEN
          export NIX_CONFIG="${NIX_CONFIG:-}"$'\n'"netrc-file = $rex_netrc"
          python3 scripts/validation.py --platform darwin

  vm-services:
    name: Service VM Tests (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.services_vm
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate service VMs
        run: python3 scripts/validation.py --platform services-vm
