name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  checks:
    name: Checks (Linux)
    needs: darwin
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require native Darwin validation
        if: needs.darwin.result != 'success'
        run: |
          echo "Darwin validation did not succeed: ${{ needs.darwin.result }}"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate (same runner as hey check)
        run: |
          nix shell .#validation-tools --command python3 scripts/validation.py --ci

  herdr-vm-test:
    name: Herdr VM Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate affected Herdr VM
        run: python3 scripts/validation.py --ci --platform herdr-vm

  darwin:
    name: Darwin-only checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate affected Darwin configuration
        run: python3 scripts/validation.py --ci --platform darwin

  vm-services:
    name: Service VM Tests (Linux)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate service VMs
        run: python3 scripts/validation.py --platform services-vm
