name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Run changed packages/pi-packages QA
        shell: bash
        run: |
          set -euo pipefail
          # Manual runs and new branches have no usable "before" sha.
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          ./bin/qa-changed --base-ref "$base_sha" --head-ref "${{ github.sha }}"
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true

      # Checks are named explicitly because `nix flake check` also evaluates
      # nixosConfigurations.nuc, which needs a private input CI cannot fetch.
      # The flake's substituter is sufficient; avoid serial GHA cache uploads.
      - name: Build platform-agnostic checks
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.pre-commit \
            .#checks.x86_64-linux.zunit-tests \
            .#checks.x86_64-linux.package-harness-tests \
            .#checks.x86_64-linux.herdr-config-check \
            .#checks.x86_64-linux.agent-docs-contract

      # Darwin configuration evaluation does not require a Darwin runner.
      - name: Evaluate Darwin configurations
        run: |
          nix eval .#darwinConfigurations.MacTraitor-Pro.system --apply 'x: "OK"'
          nix eval .#darwinConfigurations.Seqeratop.system --apply 'x: "OK"'

  herdr-vm-test:
    name: Herdr VM Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Build Herdr VM test
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.vm-shell-herdr-vm-test

  darwin:
    name: Darwin-only checks
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Build Darwin pre-commit checks
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.pre-commit

  # Service VM tests are slow, so they run on request rather than every push.
  vm-services:
    name: Service VM Tests (Linux)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Build service VM checks
        run: nix build .#checks.x86_64-linux.vm-services-gatus-vm-test --no-link
