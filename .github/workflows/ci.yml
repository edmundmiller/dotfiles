name: CI

on:
  push:
    branches: [main, "candidate/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      darwin:
        description: Run native Darwin validation before Mac activation
        type: boolean
        default: false
      services_vm:
        description: Run the service VM suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  plan:
    name: Plan platform checks
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      herdr_vm: ${{ steps.plan.outputs.herdr_vm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Select affected Herdr VM before provisioning
        run: |
          VALIDATION_BASE=$(python3 scripts/candidate_ci.py base)
          export VALIDATION_BASE
          printf 'base=%s\n' "$VALIDATION_BASE" >> "$GITHUB_OUTPUT"
          plan=$(python3 scripts/validation.py --ci --platform herdr-vm --plan)
          required=$(jq -er 'if .platform == "herdr-vm" then "true" elif has("platform") and .platform == null then "false" else error("Invalid Herdr plan") end' <<< "$plan")
          printf 'herdr_vm=%s\n' "$required" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (Linux)
    needs: plan
    runs-on: ubuntu-latest
    env:
      VALIDATION_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate (same runner as hey check)
        env:
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_PRIVATE_GITHUB_TOKEN }}
          REX_TOKEN: ${{ secrets.REX_TOKEN }}
        run: |
          if [[ -z "$NIX_GITHUB_TOKEN" ]]; then
            echo "::error::Configure NIX_PRIVATE_GITHUB_TOKEN with read-only access to the private tnote and agents-workspace repositories."
            exit 1
          fi
          if [[ -z "$REX_TOKEN" ]]; then
            echo "::error::Configure REX_TOKEN with access to pkgs.superlogical.com."
            exit 1
          fi
          umask 077
          rex_netrc=$(mktemp "$RUNNER_TEMP/rex-netrc.XXXXXX")
          trap 'rm -f "$rex_netrc"' EXIT
          printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_TOKEN" > "$rex_netrc"
          unset REX_TOKEN
          export NIX_CONFIG="${NIX_CONFIG:-}"$'\n'"netrc-file = $rex_netrc"
          nix shell .#validation-tools --command python3 scripts/validation.py --ci

  # Preserve the contexts required by main without weakening branch protection.
  required-checks:
    name: ${{ matrix.context }}
    needs: [plan, checks, herdr-vm-test, darwin, vm-services]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [Flake Check (Linux), Check Formatting]
    steps:
      - name: Require every selected check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LINUX_RESULT: ${{ needs.checks.result }}
          HERDR_REQUIRED: ${{ needs.plan.outputs.herdr_vm }}
          HERDR_RESULT: ${{ needs.herdr-vm-test.result }}
          DARWIN_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.darwin }}
          DARWIN_RESULT: ${{ needs.darwin.result }}
          SERVICES_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.services_vm }}
          SERVICES_RESULT: ${{ needs.vm-services.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$LINUX_RESULT" = success
          for result in "$HERDR_REQUIRED:$HERDR_RESULT" "$DARWIN_REQUIRED:$DARWIN_RESULT" "$SERVICES_REQUIRED:$SERVICES_RESULT"; do
            case "$result" in
              true:success|false:skipped) ;;
              *) echo "Required check did not succeed: $result"; exit 1 ;;
            esac
          done

  herdr-vm-test:
    name: Herdr VM Test (Linux)
    needs: plan
    if: needs.plan.outputs.herdr_vm == 'true'
    runs-on: ubuntu-latest
    env:
      VALIDATION_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate affected Herdr VM
        run: python3 scripts/validation.py --ci --platform herdr-vm

  darwin:
    name: Darwin-only checks
    if: github.event_name == 'workflow_dispatch' && inputs.darwin
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Prepare Xcode 27.2 Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected_app=$(realpath /Applications/Xcode_27.2.app)
          test -d "$selected_app/Contents/Developer"
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$nixpkgs#nushell" "github:NixOS/nixpkgs/$nixpkgs#mise" --command \
            env MISE_TRUSTED_CONFIG_PATHS="$PWD" mise run xcode:setup "$selected_app" --apply
          env -u DEVELOPER_DIR /usr/bin/xcrun --no-cache --find metallib
      - name: Free space for Darwin builds
        shell: bash
        run: |
          set -euo pipefail
          selected_developer=$(realpath "$(xcode-select --print-path)")
          selected_app="${selected_developer%/Contents/Developer}"
          test -d "$selected_app/Contents/Developer"
          df -h /
          for app in /Applications/Xcode*.app; do
            if [[ ! -d "$app" || -L "$app" ]]; then
              continue
            fi
            if [[ "$(realpath "$app")" != "$selected_app" ]]; then
              printf 'Removing inactive Xcode: %s\n' "$app"
              sudo rm -rf -- "$app"
            fi
          done
          xcodebuild -version
          df -h /
      - name: Verify Metal discovery as a Nix build user
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs --expr "$(cat <<'NIX'
          builtins.derivation {
            name = "darwin-metal-toolchain-preflight";
            system = "aarch64-darwin";
            builder = "/bin/bash";
            __noChroot = true;
            preferLocalBuild = true;
            allowSubstitutes = false;
            args = [ "-euc" ''
              /usr/bin/id
              export DEVELOPER_DIR="$(/usr/bin/xcode-select -p)"
              /usr/bin/xcodebuild -showComponent MetalToolchain
              export SDKROOT="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
              for tool in swiftc metal metallib; do
                /usr/bin/xcrun --find "$tool"
              done
              /usr/bin/xcrun metal --version
              /usr/bin/touch "$out"
            '' ];
          }
          NIX
          )"
      - name: Validate native Darwin configuration
        env:
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_PRIVATE_GITHUB_TOKEN }}
          REX_TOKEN: ${{ secrets.REX_TOKEN }}
        run: |
          if [[ -z "$NIX_GITHUB_TOKEN" ]]; then
            echo "::error::Configure NIX_PRIVATE_GITHUB_TOKEN with read-only access to the private tnote and agents-workspace repositories."
            exit 1
          fi
          if [[ -z "$REX_TOKEN" ]]; then
            echo "::error::Configure REX_TOKEN with access to pkgs.superlogical.com."
            exit 1
          fi
          umask 077
          rex_netrc=$(mktemp "$RUNNER_TEMP/rex-netrc.XXXXXX")
          trap 'rm -f "$rex_netrc"' EXIT
          printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_TOKEN" > "$rex_netrc"
          unset REX_TOKEN
          export NIX_CONFIG="${NIX_CONFIG:-}"$'\n'"netrc-file = $rex_netrc"
          python3 scripts/validation.py --platform darwin

  vm-services:
    name: Service VM Tests (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.services_vm
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - name: Validate service VMs
        run: python3 scripts/validation.py --platform services-vm
