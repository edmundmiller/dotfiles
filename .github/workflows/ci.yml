name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Flake Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            system: x86_64-linux
          - name: Darwin
            os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Run changed packages/pi-packages QA
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ "$base_sha" == "0000000000000000000000000000000000000000" || -z "$base_sha" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          ./bin/qa-changed --base-ref "$base_sha" --head-ref "${{ github.sha }}"
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # Checks are named explicitly because `nix flake check` also evaluates
      # nixosConfigurations.nuc, which needs a private input CI cannot fetch.
      - name: Run flake checks
        run: |
          nix build --no-link --print-build-logs \
            .#checks.${{ matrix.system }}.treefmt \
            .#checks.${{ matrix.system }}.pre-commit \
            .#checks.${{ matrix.system }}.zunit-tests \
            .#checks.${{ matrix.system }}.package-harness-tests \
            .#checks.${{ matrix.system }}.herdr-config-check \
            .#checks.${{ matrix.system }}.agent-docs-contract

      - name: Check Darwin configurations evaluate
        if: matrix.system == 'aarch64-darwin'
        run: |
          nix eval .#darwinConfigurations.MacTraitor-Pro.system --apply 'x: "OK"'
          nix eval .#darwinConfigurations.Seqeratop.system --apply 'x: "OK"'

      - name: Run herdr VM test
        if: matrix.system == 'x86_64-linux'
        run: nix build --no-link .#checks.x86_64-linux.vm-shell-herdr-vm-test

  # Service VM tests are slow, so they run on request rather than every push.
  vm-services:
    name: Service VM Tests (Linux)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Build service VM checks
        run: nix build .#checks.x86_64-linux.vm-services-gatus-vm-test --no-link
