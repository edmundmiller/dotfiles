name: Deploy NUC
run-name: ${{ inputs.operation == 'ha-climate-diagnostics' && 'Inspect HA climate' || inputs.operation == 'ha-diagnostics' && (inputs.restart_bluetooth && 'Recover Bluetooth' || 'Inspect HA') || inputs.operation == 'ha-monitor-diagnostics' && 'Inspect HA monitor' || inputs.operation == 'orb-diagnostics' && 'Inspect orbs' || 'Deploy NUC' }} ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact published main workflow commit (40-character lowercase SHA)
        required: true
        type: string
      operation:
        description: Deploy this revision or inspect HA or the orb provider without activation
        type: choice
        default: deploy
        options:
          - deploy
          - ha-diagnostics
          - ha-climate-diagnostics
          - ha-monitor-diagnostics
          - orb-diagnostics
      ha_monitor:
        description: Arm the local HA runtime monitor for Gatus and verify live timer runs (requires approval)
        default: false
        type: boolean
      orb_pilot:
        description: Run NUC orb capacity preflight and live container-backend smoke tests
        default: false
        type: boolean
      recover_orb_pilot:
        description: Stop only dedicated pilot containers, preserving disks, before pilot deployment (requires approval and orb_pilot)
        default: false
        type: boolean
      restart_bluetooth:
        description: Restart Bluetooth once before HA diagnostics (requires explicit approval)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-nuc
  cancel-in-progress: false

jobs:
  wait-for-ci:
    if: github.repository == 'edmundmiller/dotfiles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require requested deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$DEPLOY_SHA" ]]; then
            echo "NUC deployment revision mismatch: expected_sha must be the exact captured main commit" >&2
            exit 1
          fi
      - name: Wait for exact-main CI in GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # No checkout, Nix, environment secrets or OIDC while waiting.
          for ((attempt=1; attempt<=180; attempt++)); do
            main=$(gh api repos/edmundmiller/dotfiles/git/ref/heads/main --jq .object.sha)
            if [[ "$main" != "$DEPLOY_SHA" ]]; then
              echo "NUC deployment stopped: main moved beyond the authorized revision" >&2
              exit 1
            fi
            # Include failed/running reruns; never search for a previous success.
            runs=$(gh api "repos/edmundmiller/dotfiles/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1")
            state=$(jq -er --arg sha "$DEPLOY_SHA" '
              if (.workflow_runs | type) != "array" then error("Invalid CI response")
              elif (.workflow_runs | length) == 0 then "pending"
              else .workflow_runs[0] |
                if .head_sha != $sha or .head_branch != "main" or .event != "push" or
                   .path != ".github/workflows/ci.yml" then error("CI identity mismatch")
                elif .status == "completed" then
                  if .conclusion == "success" then "success" else "failed" end
                elif (.status == "queued" or .status == "in_progress" or .status == "waiting" or
                      .status == "requested" or .status == "pending") then "pending"
                else error("Unknown CI status") end
              end' <<< "$runs")
            case "$state" in
              success) echo "Exact-main CI succeeded; deployment will recheck before activation"; exit 0 ;;
              failed) echo "NUC deployment stopped: latest CI attempt did not succeed" >&2; exit 1 ;;
            esac
            if ((attempt < 180)); then sleep 30; fi
          done
          echo "NUC deployment timed out waiting for exact-main CI" >&2
          exit 1

  deploy:
    needs: wait-for-ci
    if: github.repository == 'edmundmiller/dotfiles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: nuc
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require requested deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$DEPLOY_SHA" ]]; then
            echo "NUC deployment revision mismatch: expected_sha must be the exact captured main commit" >&2
            exit 1
          fi
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main=$(gh api repos/edmundmiller/dotfiles/git/ref/heads/main --jq .object.sha)
          test "$main" = "$DEPLOY_SHA"
          # Do not filter for success: a failed/in-progress rerun must block deployment.
          gh api "repos/edmundmiller/dotfiles/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1" |
            jq -e --arg sha "$DEPLOY_SHA" '
              .workflow_runs[0] |
              .head_sha == $sha and .head_branch == "main" and
              .event == "push" and .status == "completed" and .conclusion == "success"
            '
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df
      - name: Join tailnet with short-lived GitHub identity
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-nuc-deploy
          ping: nuc.cinnamon-rooster.ts.net
      - name: Check live orb pilot capacity before activation
        if: inputs.operation == 'deploy' && inputs.orb_pilot
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- preflight' < scripts/amp-orb-pilot.sh
      - name: Release inherited pilot locks before activation
        if: inputs.operation == 'deploy' && inputs.recover_orb_pilot
        env:
          ORB_PILOT: ${{ inputs.orb_pilot }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ORB_PILOT" = true
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- recover' < scripts/amp-orb-pilot.sh
      - name: Configure approved HA monitor before activation
        if: inputs.operation == 'deploy' && inputs.ha_monitor
        shell: bash
        run: |
          set -euo pipefail
          # Expand hostname on NUC, not the GitHub runner.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            uname -a
            exec sudo -n uv run --no-project python - setup
          ' < modules/services/hass/monitor-gatus.py
      - name: Fetch, build, activate and verify on the NUC
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$nixpkgs#nushell" "github:NixOS/nixpkgs/$nixpkgs#mise" --command \
            env MISE_TRUSTED_CONFIG_PATHS="$PWD" mise run nuc revision "$DEPLOY_SHA"
      - name: Verify live orb pilot backend
        if: inputs.operation == 'deploy' && inputs.orb_pilot
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- verify' < scripts/amp-orb-pilot.sh
      - name: Record deployed revision
        if: inputs.operation == 'deploy'
        run: |
          printf 'Deployed dotfiles [%s](https://github.com/edmundmiller/dotfiles/commit/%s) to NUC.\n' \
            "$DEPLOY_SHA" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Allow two automatic HA monitor runs
        if: inputs.operation == 'deploy' && inputs.ha_monitor
        shell: bash
        run: |
          set -euo pipefail
          # A prior ordinary deployment may have skipped the unprovisioned timer.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            exec sudo -n systemctl start hass-health.timer
          '
          sleep 280
      - name: Inspect Gatus history and privacy-filtered HA runtime aggregates
        if: (inputs.operation == 'deploy' && inputs.ha_monitor) || inputs.operation == 'ha-monitor-diagnostics'
        env:
          REQUIRE_LIVE: ${{ inputs.operation == 'deploy' && inputs.ha_monitor && '--require-live' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # The helper exports only Gatus probe metadata and local journal aggregates.
          # Credentials and complete HA reports never leave NUC.
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "
            set -eu
            test \"\$(hostname)\" = nuc
            printf 'configurationRevision=%s\\n' \"\$(nixos-version --configuration-revision)\"
            systemctl show hass-health.service -p ActiveState -p SubState -p Result -p ExecMainStatus
            exec sudo -n uv run --no-project python - status --since-hours 24 $REQUIRE_LIVE
          " < modules/services/hass/monitor-gatus.py
      - name: Restart Bluetooth once and allow automatic HA retry
        if: inputs.operation == 'ha-diagnostics' && inputs.restart_bluetooth
        shell: bash
        run: |
          set -euo pipefail
          # Expand these variables on NUC, not on the GitHub runner.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            export PATH="/run/wrappers/bin:$PATH"
            test "$(hostname)" = nuc
            revision=$(nixos-version --configuration-revision)
            ha_pid=$(systemctl show home-assistant.service -p MainPID --value)
            systemctl is-active --quiet home-assistant.service
            printf "configurationRevisionBefore=%s\nhaMainPIDBefore=%s\n" "$revision" "$ha_pid"
            systemctl show bluetooth.service -p MainPID -p ActiveEnterTimestamp
            sudo -n systemctl restart bluetooth.service
            systemctl is-active --quiet bluetooth.service
            systemctl show bluetooth.service -p MainPID -p ActiveEnterTimestamp
            test "$(nixos-version --configuration-revision)" = "$revision"
            test "$(systemctl show home-assistant.service -p MainPID --value)" = "$ha_pid"
          '
          # HA 2026.11 caps setup-retry backoff at 600s; allow another minute for setup.
          sleep 660
      - name: Inspect orb provider without activation
        if: inputs.operation == 'orb-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- diagnostics' < scripts/amp-orb-pilot.sh
      - name: Inspect climate mapping and categorized retained errors without activation
        if: inputs.operation == 'ha-climate-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Fixed entity, registry-linked integration and categorized errors only.
          # Token and raw journal remain on NUC; the old history read is not repeated.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            exec sudo -n uv run --no-project --script -
          ' < modules/services/hass/climate-entity-diagnostics.py
      - name: Inspect retained critical entity failures without activation
        if: inputs.operation == 'ha-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Only the five configured entity IDs, failure states and times leave NUC.
          # No HA API credential is needed; the existing journal stays on NUC.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            exec sudo -n uv run --no-project python -
          ' < modules/services/hass/critical-entity-history.py
      - name: Inspect running HA without activation
        if: inputs.operation == 'ha-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Stream the tested reader, not a new host configuration. Token stays on NUC.
          result=0
          # Expand these variables on NUC, not on the GitHub runner.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            export PATH="/run/wrappers/bin:$PATH"
            printf "hostname=%s\n" "$(hostname)" >&2
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            systemctl show home-assistant.service -p ActiveState -p SubState -p MainPID -p ActiveEnterTimestamp >&2
            systemctl show home-assistant.service -p User -p SupplementaryGroups -p CapabilityBoundingSet -p AmbientCapabilities -p PrivateDevices -p PrivateNetwork >&2
            systemctl show bluetooth.service -p LoadState -p ActiveState -p SubState >&2
            adapters=0
            for adapter in /sys/class/bluetooth/hci*; do
              test -e "$adapter" || continue
              adapters=$((adapters + 1))
              printf "bluetooth_kernel_adapter=%s\n" "${adapter##*/}" >&2
            done
            printf "bluetooth_kernel_adapters=%s\n" "$adapters" >&2
            radios=0
            for radio in /sys/class/rfkill/rfkill*; do
              test -r "$radio/type" || continue
              test "$(cat "$radio/type")" = bluetooth || continue
              radios=$((radios + 1))
              printf "bluetooth_rfkill_soft=%s hard=%s\n" "$(cat "$radio/soft")" "$(cat "$radio/hard")" >&2
            done
            printf "bluetooth_rfkill_radios=%s\n" "$radios" >&2
            exec sudo -n uv run --no-project --script - health \
              --url http://127.0.0.1:8123 --token-file /run/agenix/ha-hermes-token \
              --expected-version 2026.11.0 --entity climate.main_floor --entity climate.master_suite \
              --entity script.goodnight --entity script.good_morning --entity script.get_ready_for_bed --json
          ' < modules/services/hass/hass-health.py > "$RUNNER_TEMP/ha-health.json" || result=$?
          # Includes observed failures and unknowns; neither is silently made healthy.
          jq -e '.schema_version == 1 and (.status | IN("healthy", "unhealthy", "unknown"))' \
            "$RUNNER_TEMP/ha-health.json" > /dev/null
          jq . "$RUNNER_TEMP/ha-health.json"
          {
            printf '## Read-only HA diagnostics\n\nThis step only reads HA. Any approved Bluetooth service restart is recorded in the preceding step.\n\n```json\n'
            jq . "$RUNNER_TEMP/ha-health.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
