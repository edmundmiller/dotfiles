name: Deploy NUC
run-name: Deploy NUC ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact published main commit to deploy (40-character lowercase SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-nuc
  cancel-in-progress: false

jobs:
  wait-for-ci:
    if: github.repository == 'edmundmiller/dotfiles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require requested deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$DEPLOY_SHA" ]]; then
            echo "NUC deployment revision mismatch: expected_sha must be the exact captured main commit" >&2
            exit 1
          fi
      - name: Wait for exact-main CI in GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # No checkout, Nix, environment secrets or OIDC while waiting.
          for ((attempt=1; attempt<=180; attempt++)); do
            main=$(gh api repos/edmundmiller/dotfiles/git/ref/heads/main --jq .object.sha)
            if [[ "$main" != "$DEPLOY_SHA" ]]; then
              echo "NUC deployment stopped: main moved beyond the authorized revision" >&2
              exit 1
            fi
            # Include failed/running reruns; never search for a previous success.
            runs=$(gh api "repos/edmundmiller/dotfiles/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1")
            state=$(jq -er --arg sha "$DEPLOY_SHA" '
              if (.workflow_runs | type) != "array" then error("Invalid CI response")
              elif (.workflow_runs | length) == 0 then "pending"
              else .workflow_runs[0] |
                if .head_sha != $sha or .head_branch != "main" or .event != "push" or
                   .path != ".github/workflows/ci.yml" then error("CI identity mismatch")
                elif .status == "completed" then
                  if .conclusion == "success" then "success" else "failed" end
                elif (.status == "queued" or .status == "in_progress" or .status == "waiting" or
                      .status == "requested" or .status == "pending") then "pending"
                else error("Unknown CI status") end
              end' <<< "$runs")
            case "$state" in
              success) echo "Exact-main CI succeeded; deployment will recheck before activation"; exit 0 ;;
              failed) echo "NUC deployment stopped: latest CI attempt did not succeed" >&2; exit 1 ;;
            esac
            if ((attempt < 180)); then sleep 30; fi
          done
          echo "NUC deployment timed out waiting for exact-main CI" >&2
          exit 1

  deploy:
    needs: wait-for-ci
    if: github.repository == 'edmundmiller/dotfiles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: nuc
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require requested deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$DEPLOY_SHA" ]]; then
            echo "NUC deployment revision mismatch: expected_sha must be the exact captured main commit" >&2
            exit 1
          fi
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main=$(gh api repos/edmundmiller/dotfiles/git/ref/heads/main --jq .object.sha)
          test "$main" = "$DEPLOY_SHA"
          # Do not filter for success: a failed/in-progress rerun must block deployment.
          gh api "repos/edmundmiller/dotfiles/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1" |
            jq -e --arg sha "$DEPLOY_SHA" '
              .workflow_runs[0] |
              .head_sha == $sha and .head_branch == "main" and
              .event == "push" and .status == "completed" and .conclusion == "success"
            '
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df
      - name: Join tailnet with short-lived GitHub identity
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-nuc-deploy
          ping: nuc.cinnamon-rooster.ts.net
      - name: Fetch, build, activate and verify on the NUC
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$nixpkgs#nushell" "github:NixOS/nixpkgs/$nixpkgs#mise" --command \
            env MISE_TRUSTED_CONFIG_PATHS="$PWD" mise run nuc revision "$DEPLOY_SHA"
      - name: Record deployed revision
        run: |
          printf 'Deployed dotfiles [%s](https://github.com/edmundmiller/dotfiles/commit/%s) to NUC.\n' \
            "$DEPLOY_SHA" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
