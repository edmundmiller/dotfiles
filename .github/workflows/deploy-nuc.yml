name: Deploy NUC
run-name: ${{ (inputs.operation == 'gatus-email-diagnostic' || inputs.operation == 'gatus-email-client-diagnostic') && 'Diagnose Gatus email preflight' || (inputs.operation == 'gatus-email-acceptance' || inputs.operation == 'gatus-email-client-acceptance') && 'Test synthetic Gatus email' || inputs.operation == 'ha-plant-diagnostics' && 'Inspect HA plant lights' || inputs.operation == 'ha-climate-recurrence' && 'Inspect HA climate recurrence' || inputs.operation == 'ha-climate-diagnostics' && 'Inspect HA climate' || inputs.operation == 'ha-diagnostics' && (inputs.restart_bluetooth && 'Recover Bluetooth' || 'Inspect HA') || inputs.operation == 'ha-monitor-diagnostics' && 'Inspect HA monitor' || inputs.operation == 'orb-diagnostics' && 'Inspect orbs' || inputs.operation == 'orb-note4c-serial' && 'Enable Note 4C serial' || inputs.operation == 'orb-dji-capture' && 'Enable DJI capture' || inputs.operation == 'rollout' && 'Roll out NUC' || 'Deploy NUC' }} ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact published main workflow commit (40-character lowercase SHA); rollout records the main it was dispatched for
        required: true
        type: string
      operation:
        description: Deploy, roll out newest green main (standing authority), inspect HA/orbs, or enable approved scoped serial/capture access
        type: choice
        default: deploy
        options:
          - deploy
          - rollout
          - ha-diagnostics
          - ha-climate-diagnostics
          - ha-climate-recurrence
          - ha-plant-diagnostics
          - ha-monitor-diagnostics
          - gatus-email-acceptance
          - gatus-email-client-acceptance
          - gatus-email-diagnostic
          - gatus-email-client-diagnostic
          - orb-diagnostics
          - orb-note4c-serial
          - orb-dji-capture
          - headset-diagnostics
      email_test_family_revision:
        description: Email operations only; exact deployed Family SHA requires separately verified readiness
        type: string
      email_diagnostic_family_version:
        description: Email diagnostic or fresh acceptance; verified live Family version UUID
        type: string
      incident_start:
        description: Recurrence only; UTC time of human/checker-confirmed climate.master_suite incident
        type: string
      incident_cutoff:
        description: Recurrence only; explicit UTC capture cutoff, never in the future
        type: string
      recovered_at:
        description: Recurrence only; optional reported UTC recovery within incident bounds
        type: string
      ha_monitor:
        description: Arm the local HA runtime monitor for Gatus and verify live timer runs (requires approval)
        default: false
        type: boolean
      preserve_ha:
        description: Deploy only if the exact target closure and dry activation preserve the running HA service
        default: false
        type: boolean
      orb_pilot:
        description: Run NUC orb capacity preflight and live container-backend smoke tests
        default: false
        type: boolean
      recover_orb_pilot:
        description: Stop only dedicated pilot containers, preserving disks, before pilot deployment (requires approval and orb_pilot)
        default: false
        type: boolean
      restart_bluetooth:
        description: Restart Bluetooth once before HA diagnostics (requires explicit approval)
        default: false
        type: boolean

permissions:
  contents: read

# One run at a time. A newer pending run replaces an older pending one; an
# active switch is never cancelled. Rollout picks its target when it starts.
concurrency:
  group: deploy-nuc
  cancel-in-progress: false

jobs:
  wait-for-ci:
    if: github.repository == 'edmundmiller/dotfiles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require requested deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          # Rollout records the main it was dispatched for; it selects its target later.
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ||
                ( "${OPERATION:-deploy}" != rollout && "$EXPECTED_SHA" != "$DEPLOY_SHA" ) ]]; then
            echo "NUC deployment revision mismatch: expected_sha must be the exact captured main commit" >&2
            exit 1
          fi
      - name: Require standing rollout authority
        if: inputs.operation == 'rollout'
        env:
          NUC_ROLLOUT: ${{ vars.NUC_ROLLOUT }}
        shell: bash
        run: |
          # Per-task approvals never grant this; only the repository variable does.
          # Rollout selects only commits whose latest exact-main CI already succeeded.
          if [[ "$NUC_ROLLOUT" != continuous ]]; then
            echo "NUC rollout requires repository variable NUC_ROLLOUT=continuous" >&2
            exit 1
          fi
      - name: Wait for exact-main CI in GitHub
        if: inputs.operation != 'rollout'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # No checkout, Nix, environment secrets or OIDC while waiting.
          for ((attempt=1; attempt<=180; attempt++)); do
            main=$(gh api repos/edmundmiller/dotfiles/git/ref/heads/main --jq .object.sha)
            if [[ "$main" != "$DEPLOY_SHA" ]]; then
              echo "NUC deployment stopped: main moved beyond the authorized revision" >&2
              exit 1
            fi
            # Include failed/running reruns; never search for a previous success.
            runs=$(gh api "repos/edmundmiller/dotfiles/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1")
            state=$(jq -er --arg sha "$DEPLOY_SHA" '
              if (.workflow_runs | type) != "array" then error("Invalid CI response")
              elif (.workflow_runs | length) == 0 then "pending"
              else .workflow_runs[0] |
                if .head_sha != $sha or .head_branch != "main" or .event != "push" or
                   .path != ".github/workflows/ci.yml" then error("CI identity mismatch")
                elif .status == "completed" then
                  if .conclusion == "success" then "success" else "failed" end
                elif (.status == "queued" or .status == "in_progress" or .status == "waiting" or
                      .status == "requested" or .status == "pending") then "pending"
                else error("Unknown CI status") end
              end' <<< "$runs")
            case "$state" in
              success) echo "Exact-main CI succeeded; deployment will recheck before activation"; exit 0 ;;
              failed) echo "NUC deployment stopped: latest CI attempt did not succeed" >&2; exit 1 ;;
            esac
            if ((attempt < 180)); then sleep 30; fi
          done
          echo "NUC deployment timed out waiting for exact-main CI" >&2
          exit 1

  deploy:
    needs: wait-for-ci
    if: github.repository == 'edmundmiller/dotfiles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: nuc
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Require requested deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          # Rollout never deploys expected_sha itself; it selects from live main below.
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ||
                ( "${OPERATION:-deploy}" != rollout && "$EXPECTED_SHA" != "$DEPLOY_SHA" ) ]]; then
            echo "NUC deployment revision mismatch: expected_sha must be the exact captured main commit" >&2
            exit 1
          fi
      - name: Require successful main CI for this exact commit
        if: inputs.operation != 'rollout'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main=$(gh api repos/edmundmiller/dotfiles/git/ref/heads/main --jq .object.sha)
          test "$main" = "$DEPLOY_SHA"
          # Do not filter for success: a failed/in-progress rerun must block deployment.
          gh api "repos/edmundmiller/dotfiles/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1" |
            jq -e --arg sha "$DEPLOY_SHA" '
              .workflow_runs[0] |
              .head_sha == $sha and .head_branch == "main" and
              .event == "push" and .status == "completed" and .conclusion == "success"
            '
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Rollout needs main's history for ancestry, trailers and coalescing.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df
      - name: Join tailnet with short-lived GitHub identity
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-nuc-deploy
          ping: ${{ inputs.operation != 'ha-climate-recurrence' && 'nuc.cinnamon-rooster.ts.net' || '' }}
      - name: Run one approved synthetic email pair before production activation
        if: inputs.operation == 'gatus-email-acceptance' || inputs.operation == 'gatus-email-client-acceptance'
        env:
          FAMILY_REVISION: ${{ inputs.email_test_family_revision }}
          FAMILY_VERSION: ${{ inputs.email_diagnostic_family_version }}
          ACCEPTANCE_COMMAND: ${{ inputs.operation == 'gatus-email-client-acceptance' && 'acceptance-client-test' || 'acceptance-test' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FAMILY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$ACCEPTANCE_COMMAND" == acceptance-client-test ]]; then
            [[ "$FAMILY_VERSION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          else
            [[ -z "$FAMILY_VERSION" ]]
          fi
          # Family readiness and an exclusive synthetic window must be confirmed
          # by its owner before dispatch. This operation never activates NixOS.
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "
            set -eu
            test \"\$(hostname)\" = nuc
            uname -a
            printf 'configurationRevision=%s\\n' \"\$(nixos-version --configuration-revision)\"
            exec sudo -n env GATUS_EMAIL_TEST_FAMILY_REVISION='$FAMILY_REVISION' \
              GATUS_EMAIL_DIAGNOSTIC_FAMILY_VERSION='$FAMILY_VERSION' \
              GATUS_EMAIL_DIAGNOSTIC_RUN_ID='$GITHUB_RUN_ID' \
              uv run --no-project python - '$ACCEPTANCE_COMMAND'
          " < modules/services/gatus/incident-delivery.py
          echo 'Synthetic receiver/FIFO pair acknowledged. Family provider receipts and independent inbox proof still required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose email preflight without replaying the synthetic pair
        if: inputs.operation == 'gatus-email-diagnostic' || inputs.operation == 'gatus-email-client-diagnostic'
        env:
          FAMILY_REVISION: ${{ inputs.email_test_family_revision }}
          FAMILY_VERSION: ${{ inputs.email_diagnostic_family_version }}
          DIAGNOSTIC_COMMAND: ${{ inputs.operation == 'gatus-email-client-diagnostic' && 'email-client-diagnostic' || 'email-diagnostic' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FAMILY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FAMILY_VERSION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          # Separately approved once; never calls the acceptance pair or activates NixOS.
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "
            set -eu
            test \"\$(hostname)\" = nuc
            uname -a
            printf 'configurationRevision=%s\\n' \"\$(nixos-version --configuration-revision)\"
            exec sudo -n env GATUS_EMAIL_TEST_FAMILY_REVISION='$FAMILY_REVISION' \
              GATUS_EMAIL_DIAGNOSTIC_FAMILY_VERSION='$FAMILY_VERSION' \
              GATUS_EMAIL_DIAGNOSTIC_RUN_ID='$GITHUB_RUN_ID' \
              uv run --no-project python - '$DIAGNOSTIC_COMMAND'
          " < modules/services/gatus/incident-delivery.py
      - name: Check live orb pilot capacity before activation
        if: inputs.operation == 'deploy' && inputs.orb_pilot
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- preflight' < scripts/amp-orb-pilot.sh
      - name: Release inherited pilot locks before activation
        if: inputs.operation == 'deploy' && inputs.recover_orb_pilot
        env:
          ORB_PILOT: ${{ inputs.orb_pilot }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ORB_PILOT" = true
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- recover' < scripts/amp-orb-pilot.sh
      - name: Configure approved HA monitor before activation
        if: inputs.operation == 'deploy' && inputs.ha_monitor
        shell: bash
        run: |
          set -euo pipefail
          # Expand hostname on NUC, not the GitHub runner.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            uname -a
            exec sudo -n uv run --no-project python - setup
          ' < modules/services/hass/monitor-gatus.py
      - name: Read the active NUC generation before rollout
        id: before
        if: inputs.operation == 'rollout'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          revision=$(tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            nixos-version --configuration-revision
          ')
          printf 'configuration_revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'monotonic=%s\n' "$(tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'cut -d" " -f1 /proc/uptime')" >> "$GITHUB_OUTPUT"
      - name: Select the newest green published commit
        id: select
        if: inputs.operation == 'rollout'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURATION_REVISION: ${{ steps.before.outputs.configuration_revision }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          main=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$DEPLOY_SHA" "$main"
          python3 scripts/nuc_rollout.py select --main "$main" \
            --configuration-revision "$CONFIGURATION_REVISION" | tee "$RUNNER_TEMP/selection.json"
          {
            printf 'main=%s\n' "$main"
            printf 'outcome=%s\n' "$(jq -er .outcome "$RUNNER_TEMP/selection.json")"
            printf 'target=%s\n' "$(jq -r '.target // ""' "$RUNNER_TEMP/selection.json")"
            printf 'previous=%s\n' "$(jq -r '.active // ""' "$RUNNER_TEMP/selection.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Build and activate the selected revision with the published-ancestry guard
        id: activate
        if: inputs.operation == 'rollout' && steps.select.outputs.target != ''
        env:
          TARGET: ${{ steps.select.outputs.target }}
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          # A target rerun may have failed or started after selection. Newer red
          # main commits are irrelevant; only this exact target must remain green.
          python3 scripts/nuc_rollout.py verify --sha "$TARGET"
          # Trusted main code drives the same pinned flake, provenance readback and
          # host lock as exact deployments; only the guard accepts a trailing target.
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$nixpkgs#nushell" "github:NixOS/nixpkgs/$nixpkgs#mise" --command \
            env MISE_TRUSTED_CONFIG_PATHS="$PWD" mise run nuc revision "$TARGET" published 2>&1 |
            tee "$RUNNER_TEMP/activate.log"
      - name: Inspect existing network event sources without device traffic
        if: inputs.operation == 'deploy' && inputs.preserve_ha
        shell: bash
        run: |
          set -euo pipefail
          # Inventory runs before activation, including when preservation refuses it.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\\n" "$(nixos-version --configuration-revision)"
            exec sudo -n uv run --no-project --script - --network-sources
          ' < modules/services/hass/climate-entity-diagnostics.py
      - name: Fetch, build, activate and verify on the NUC
        if: inputs.operation == 'deploy'
        env:
          NUC_PRESERVE_HA: ${{ inputs.preserve_ha && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$nixpkgs#nushell" "github:NixOS/nixpkgs/$nixpkgs#mise" --command \
            env MISE_TRUSTED_CONFIG_PATHS="$PWD" mise run nuc revision "$DEPLOY_SHA"
      - name: Verify automatic climate capture from the existing checker
        if: inputs.operation == 'deploy' && inputs.preserve_ha
        shell: bash
        run: |
          set -euo pipefail
          # This is an inventory read, not a synthetic outage or device probe.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            systemctl is-active hass-climate-capture.path hass-health.timer home-assistant.service
            # Observe a real checker-triggered invocation, not a synthetic outage
            # or forced checker run. The existing timer and assessment stay intact.
            for attempt in $(seq 1 18); do
              started=$(systemctl show hass-climate-capture.service -p ExecMainStartTimestampMonotonic --value)
              state=$(systemctl show hass-climate-capture.service -p ActiveState --value)
              test "$state" != failed
              if test "${started:-0}" -gt 0 && test "$state" = inactive; then
                test "$(systemctl show hass-climate-capture.service -p Result --value)" = success
                test "$(systemctl show hass-climate-capture.service -p ExecMainStatus --value)" = 0
                test "$(sudo -n stat -Lc %a /var/lib/hass-climate-capture/incident.json)" = 600
                break
              fi
              test "$attempt" -lt 18
              sleep 10
            done
            printf "automatic_climate_path=active checker_trigger=observed private_state=600\\n"
            printf "configurationRevision=%s\\n" "$(nixos-version --configuration-revision)"
          '
      - name: Verify live orb pilot backend
        if: inputs.operation == 'deploy' && inputs.orb_pilot
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- verify' < scripts/amp-orb-pilot.sh
      - name: Verify HA-runtime email receiver after activation
        id: health
        if: inputs.operation == 'deploy' || (inputs.operation == 'rollout' && steps.activate.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          # Read only service metadata, a credential-free allowlist and queue health.
          # Do not send synthetic production events or inspect live SQLite files.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            systemctl is-active --quiet gatus.service gatus-email.service home-assistant.service hass-health.timer
            endpoints=$(systemctl show gatus-email.service -p ExecStart --value | grep -oE "/nix/store/[a-z0-9]+-gatus-email-endpoints.json")
            jq -e '\''. == ["Smart Home: Home Assistant Runtime"]'\'' "$endpoints"
            test "$(ss -H -ltn "sport = :8126" | awk "{print \$4}")" = 127.0.0.1:8126
            curl -fsS --max-time 5 --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8126/health |
              jq -e '\''{pending, delivery_errors, oldest_pending_seconds, queue_used} |
                if .pending == 0 and .delivery_errors == 0 and .oldest_pending_seconds == 0 and .queue_used == 0
                then . else error("Email queue not empty and healthy after activation") end'\''
            curl -fsS --max-time 5 http://127.0.0.1:8084/health > /dev/null
            curl -fsS --max-time 5 http://127.0.0.1:8124/health > /dev/null
            printf "HA-runtime-only email receiver is active, loopback-only and healthy; no production events injected.\n"
          '
      - name: Verify HA-runtime Notion receiver after activation
        id: notion-health
        if: inputs.operation == 'deploy' || (inputs.operation == 'rollout' && steps.activate.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          # Check the local receiver without injecting a production incident.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            systemctl is-active --quiet gatus-notion.service
            endpoints=$(systemctl show gatus-notion.service -p ExecStart --value | grep -oE "/nix/store/[a-z0-9]+-gatus-notion-endpoints.json")
            jq -e '\''. == ["Smart Home: Home Assistant Runtime"]'\'' "$endpoints"
            test "$(ss -H -ltn "sport = :8125" | awk "{print \$4}")" = 127.0.0.1:8125
            test "$(sudo -n stat -Lc "%U:%G:%a" /run/agenix/gatus-notion-api)" = root:root:400
            curl -fsS --max-time 5 --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8125/health |
              jq -e '\''{pending, delivery_errors, oldest_pending_seconds, queue_used} |
                if .pending == 0 and .delivery_errors == 0 and .oldest_pending_seconds == 0 and .queue_used == 0
                then . else error("Notion queue not empty and healthy after activation") end'\''
            printf "HA-runtime-only Notion receiver is active, loopback-only and healthy.\n"
          '
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'sudo -n uv run --no-project python -' <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          try:
              token = Path('/run/agenix/gatus-notion-api').read_text().strip()
              request = Request('https://api.notion.com/v1/data_sources/e5899731-9190-4f81-b5e0-36ccbc5a5f00', headers={
                  'Authorization': 'Bearer ' + token, 'Notion-Version': '2026-03-11'})
              with urlopen(request, timeout=20) as response:
                  source = json.load(response)
              expected = {'Name': 'title', 'Incident ID': 'rich_text', 'Status': 'select',
                          'Detected': 'date', 'Recovered': 'date', 'Evidence': 'url'}
              assert all(source['properties'][name]['type'] == kind for name, kind in expected.items())
              assert {'Open', 'Resolved'} <= {item['name'] for item in source['properties']['Status']['select']['options']}
          except Exception:
              raise SystemExit('Notion runtime read-only authentication/schema check failed; details suppressed') from None
          print('Notion runtime credential authenticated and incident schema matched; no data written.')
          PY
      - name: Read back the active generation and affected services
        if: always() && inputs.operation == 'rollout' && steps.select.outputs.target != ''
        env:
          SINCE: ${{ steps.before.outputs.monotonic }}
        shell: bash
        run: |
          set -euo pipefail
          # Units whose state changed since activation started are the affected services.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "SINCE='$SINCE' bash -s" > "$RUNNER_TEMP/readback.json" <<'READBACK'
          set -eu
          test "$(hostname)" = nuc
          since_us=$(awk -v s="${SINCE:-0}" 'BEGIN { printf "%.0f", s * 1000000 }')
          units=$(systemctl list-units --type=service --all --no-legend --plain | awk '{print $1}')
          changed=$(systemctl show -p Id -p ActiveState -p SubState -p Result -p StateChangeTimestampMonotonic $units |
            awk -v since="$since_us" 'BEGIN { RS=""; FS="\n" } {
              delete f; for (i = 1; i <= NF; i++) { split($i, kv, "="); f[kv[1]] = substr($i, length(kv[1]) + 2) }
              if (f["StateChangeTimestampMonotonic"] + 0 > since + 0)
                printf "{\"Id\":\"%s\",\"ActiveState\":\"%s\",\"SubState\":\"%s\",\"Result\":\"%s\"}\n", f["Id"], f["ActiveState"], f["SubState"], f["Result"]
            }' | jq -s .)
          failed=$(systemctl list-units --failed --no-legend --plain | awk '{print $1}' | jq -R . | jq -s .)
          jq -n --arg revision "$(nixos-version --configuration-revision || true)" \
            --arg current "$(readlink -f /run/current-system)" --arg booted "$(readlink -f /run/booted-system)" \
            --argjson changed "$changed" --argjson failed "$failed" \
            '{configurationRevision: $revision, currentSystem: $current, bootedSystem: $booted,
              changedUnits: $changed, failedUnits: $failed}'
          READBACK
      - name: Classify and report the rollout
        id: report
        if: always() && inputs.operation == 'rollout'
        env:
          OUTCOME: ${{ steps.select.outputs.outcome }}
          TARGET: ${{ steps.select.outputs.target }}
          PREVIOUS: ${{ steps.select.outputs.previous }}
          MAIN: ${{ steps.select.outputs.main }}
          ACTIVATION: ${{ steps.activate.outcome }}
          HEALTH: ${{ steps.health.outcome == 'success' && steps.notion-health.outcome == 'success' && 'success' || 'failure' }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          if [[ -n "$TARGET" ]]; then
            python3 scripts/nuc_rollout.py report --previous "$PREVIOUS" --target "$TARGET" --main "$MAIN" \
              --activation "$ACTIVATION" --health "$HEALTH" \
              --readback "$RUNNER_TEMP/readback.json" --log "$RUNNER_TEMP/activate.log" > "$RUNNER_TEMP/report/report.json"
          elif [[ -f "$RUNNER_TEMP/selection.json" ]]; then
            cp "$RUNNER_TEMP/selection.json" "$RUNNER_TEMP/report/report.json"
          else
            jq -n '{schemaVersion: 1, outcome: "selection_failed", next: "Inspect this run; the host was not changed."}' \
              > "$RUNNER_TEMP/report/report.json"
          fi
          outcome=$(jq -er .outcome "$RUNNER_TEMP/report/report.json")
          case "$outcome" in
            deployed) marker=nuc-rollout-deployed ;;
            host_busy) marker=nuc-rollout-deferred ;;
            not_activated|activated_unhealthy) marker="nuc-rollout-failed-$TARGET" ;;
            unknown|unknown_active) marker=nuc-rollout-blocked ;;
            *) marker="" ;;
          esac
          printf 'outcome=%s\nmarker=%s\n' "$outcome" "$marker" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation == 'rollout' && steps.report.outcome == 'success'
        with:
          name: nuc-rollout-report
          path: ${{ runner.temp }}/report/report.json
          retention-days: 90
          if-no-files-found: error
      # Fixed names are queryable state: failure excludes only its exact SHA,
      # blocked stops rollout until a later deployed marker, deferred allows a retry.
      - uses: actions/upload-artifact@v4
        if: always() && steps.report.outputs.marker != ''
        with:
          name: ${{ steps.report.outputs.marker }}
          path: ${{ runner.temp }}/report/report.json
          retention-days: 90
          if-no-files-found: error
      - name: Fail visibly unless the rollout succeeded or had nothing to do
        if: always() && inputs.operation == 'rollout'
        env:
          OUTCOME: ${{ steps.report.outputs.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in
            deployed|current|nothing_to_activate|nothing_eligible|host_busy) ;;
            *) echo "::error::NUC rollout outcome: ${OUTCOME:-unreported}. See the rollout report artifact."; exit 1 ;;
          esac
      - name: Record deployed revision
        if: inputs.operation == 'deploy'
        run: |
          printf 'Deployed dotfiles [%s](https://github.com/edmundmiller/dotfiles/commit/%s) to NUC.\n' \
            "$DEPLOY_SHA" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/report"
          jq -n --arg sha "$DEPLOY_SHA" '{schemaVersion: 1, outcome: "deployed", target: $sha, exact: true}' \
            > "$RUNNER_TEMP/report/report.json"
      # A successful exact deployment also clears an earlier blocked rollout.
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'deploy'
        with:
          name: nuc-rollout-deployed
          path: ${{ runner.temp }}/report/report.json
          retention-days: 90
          if-no-files-found: error
      - name: Allow two automatic HA monitor runs
        if: inputs.operation == 'deploy' && inputs.ha_monitor
        shell: bash
        run: |
          set -euo pipefail
          # A prior ordinary deployment may have skipped the unprovisioned timer.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            exec sudo -n systemctl start hass-health.timer
          '
          sleep 280
      - name: Inspect Gatus history and privacy-filtered HA runtime aggregates
        if: (inputs.operation == 'deploy' && inputs.ha_monitor) || inputs.operation == 'ha-monitor-diagnostics'
        env:
          REQUIRE_LIVE: ${{ inputs.operation == 'deploy' && inputs.ha_monitor && '--require-live' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # The helper exports only Gatus probe metadata and local journal aggregates.
          # Credentials and complete HA reports never leave NUC.
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "
            set -eu
            test \"\$(hostname)\" = nuc
            printf 'configurationRevision=%s\\n' \"\$(nixos-version --configuration-revision)\" >&2
            systemctl show hass-health.service -p ActiveState -p SubState -p Result -p ExecMainStatus >&2
            exec sudo -n uv run --no-project python - status --since-hours 24 $REQUIRE_LIVE
          " < modules/services/hass/monitor-gatus.py > "$RUNNER_TEMP/ha-monitor.json"
          # gh run view silently drops log lines over 64 KiB. Validate the report
          # and print short JSON lines, preserving unhealthy evidence too.
          jq -e -s '
            if length == 1 and (.[0] |
              .backend == "gatus" and (.observed_at | type == "string") and
              (.probes | type == "array") and (.probe_coverage | type == "object") and
              (.journal | type == "object") and (.local_status | type == "object") and
              (.timer_active | type == "boolean") and (.status_server_active | type == "boolean"))
            then .[0] else error("Missing or invalid HA monitor aggregate report") end
          ' "$RUNNER_TEMP/ha-monitor.json"
      - name: Restart Bluetooth once and allow automatic HA retry
        if: inputs.operation == 'ha-diagnostics' && inputs.restart_bluetooth
        shell: bash
        run: |
          set -euo pipefail
          # Expand these variables on NUC, not on the GitHub runner.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            export PATH="/run/wrappers/bin:$PATH"
            test "$(hostname)" = nuc
            revision=$(nixos-version --configuration-revision)
            ha_pid=$(systemctl show home-assistant.service -p MainPID --value)
            systemctl is-active --quiet home-assistant.service
            printf "configurationRevisionBefore=%s\nhaMainPIDBefore=%s\n" "$revision" "$ha_pid"
            systemctl show bluetooth.service -p MainPID -p ActiveEnterTimestamp
            sudo -n systemctl restart bluetooth.service
            systemctl is-active --quiet bluetooth.service
            systemctl show bluetooth.service -p MainPID -p ActiveEnterTimestamp
            test "$(nixos-version --configuration-revision)" = "$revision"
            test "$(systemctl show home-assistant.service -p MainPID --value)" = "$ha_pid"
          '
          # HA 2026.11 caps setup-retry backoff at 600s; allow another minute for setup.
          sleep 660
      - name: Inspect orb provider without activation
        if: inputs.operation == 'orb-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net 'bash -s -- diagnostics' < scripts/amp-orb-pilot.sh
      - name: Inspect approved analog headset controls without PCM or setting changes
        if: inputs.operation == 'headset-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs=$(jq -er '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          [[ "$nixpkgs" =~ ^[0-9a-f]{40}$ ]]
          # Only this public pinned tool closure is realized; no host activation.
          # shellcheck disable=SC2029
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "
            set -eu
            test \"\$(hostname)\" = nuc
            uname -a
            nixos-version --configuration-revision
            exec sudo -n nix shell 'github:NixOS/nixpkgs/$nixpkgs#alsa-utils' \
              'github:NixOS/nixpkgs/$nixpkgs#python3' --command python3 -
          " < config/amp-orbs/headset-status.py
      - name: Enable approved Note 4C serial access preserving its paused orb disk
        if: inputs.operation == 'orb-note4c-serial'
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "bash -s -- serial-enable '$DEPLOY_SHA'" < scripts/amp-orb-pilot.sh
      - name: Enable approved DJI capture-only access preserving its paused orb disk
        if: inputs.operation == 'orb-dji-capture'
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "bash -s -- dji-capture-enable '$DEPLOY_SHA'" < scripts/amp-orb-pilot.sh
      - name: Inspect plant power controls without activation
        if: inputs.operation == 'ha-plant-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Only the two anchors' light/switch siblings and names leave NUC.
          # Token and raw device identifiers stay on NUC. No service calls or writes.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            exec sudo -n uv run --no-project --script -
          ' < modules/services/hass/plant-entity-diagnostics.py
      - name: Inspect climate mapping and categorized retained errors without activation
        if: inputs.operation == 'ha-climate-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Fixed entity, registry-linked integration and categorized errors only.
          # Token and raw journal remain on NUC; the old history read is not repeated.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            exec sudo -n uv run --no-project --script -
          ' < modules/services/hass/climate-entity-diagnostics.py
      - name: Inspect one bounded climate recurrence without activation
        if: inputs.operation == 'ha-climate-recurrence'
        shell: bash
        env:
          INCIDENT_START: ${{ inputs.incident_start }}
          INCIDENT_CUTOFF: ${{ inputs.incident_cutoff }}
          RECOVERED_AT: ${{ inputs.recovered_at }}
        run: |
          set -euo pipefail
          # Restrict shell transport to timestamp characters; the reader validates UTC and bounds.
          for value in "$INCIDENT_START" "$INCIDENT_CUTOFF"; do
            [[ "$value" =~ ^[0-9T:+.Z-]+$ ]] || exit 2
          done
          [[ -z "$RECOVERED_AT" || "$RECOVERED_AT" =~ ^[0-9T:+.Z-]+$ ]] || exit 2
          # One snapshot only; no ping, wait, retry, recovery or live configuration change.
          # shellcheck disable=SC2029
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net "
            set -eu
            test \"\$(hostname)\" = nuc
            printf 'configurationRevision=%s\n' \"\$(nixos-version --configuration-revision)\" >&2
            exec sudo -n uv run --no-project --script - \\
              --incident-start '$INCIDENT_START' --incident-cutoff '$INCIDENT_CUTOFF' \\
              --recovered-at '$RECOVERED_AT'
          " < modules/services/hass/climate-entity-diagnostics.py
      - name: Inspect retained critical entity failures without activation
        if: inputs.operation == 'ha-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Only the five configured entity IDs, failure states and times leave NUC.
          # No HA API credential is needed; the existing journal stays on NUC.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            exec sudo -n uv run --no-project python -
          ' < modules/services/hass/critical-entity-history.py
      - name: Inspect running HA without activation
        if: inputs.operation == 'ha-diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          # Stream the tested reader, not a new host configuration. Token stays on NUC.
          result=0
          # Expand these variables on NUC, not on the GitHub runner.
          # shellcheck disable=SC2016
          tailscale ssh emiller@nuc.cinnamon-rooster.ts.net '
            set -eu
            export PATH="/run/wrappers/bin:$PATH"
            printf "hostname=%s\n" "$(hostname)" >&2
            test "$(hostname)" = nuc
            printf "configurationRevision=%s\n" "$(nixos-version --configuration-revision)" >&2
            systemctl show home-assistant.service -p ActiveState -p SubState -p MainPID -p ActiveEnterTimestamp >&2
            systemctl show home-assistant.service -p User -p SupplementaryGroups -p CapabilityBoundingSet -p AmbientCapabilities -p PrivateDevices -p PrivateNetwork >&2
            systemctl show bluetooth.service -p LoadState -p ActiveState -p SubState >&2
            adapters=0
            for adapter in /sys/class/bluetooth/hci*; do
              test -e "$adapter" || continue
              adapters=$((adapters + 1))
              printf "bluetooth_kernel_adapter=%s\n" "${adapter##*/}" >&2
            done
            printf "bluetooth_kernel_adapters=%s\n" "$adapters" >&2
            radios=0
            for radio in /sys/class/rfkill/rfkill*; do
              test -r "$radio/type" || continue
              test "$(cat "$radio/type")" = bluetooth || continue
              radios=$((radios + 1))
              printf "bluetooth_rfkill_soft=%s hard=%s\n" "$(cat "$radio/soft")" "$(cat "$radio/hard")" >&2
            done
            printf "bluetooth_rfkill_radios=%s\n" "$radios" >&2
            exec sudo -n uv run --no-project --script - health \
              --url http://127.0.0.1:8123 --token-file /run/agenix/ha-hermes-token \
              --expected-version 2026.11.0 --entity climate.main_floor --entity climate.master_suite \
              --entity script.goodnight --entity script.good_morning --entity script.get_ready_for_bed --json
          ' < modules/services/hass/hass-health.py > "$RUNNER_TEMP/ha-health.json" || result=$?
          # Includes observed failures and unknowns; neither is silently made healthy.
          jq -e '.schema_version == 1 and (.status | IN("healthy", "unhealthy", "unknown"))' \
            "$RUNNER_TEMP/ha-health.json" > /dev/null
          jq . "$RUNNER_TEMP/ha-health.json"
          {
            printf '## Read-only HA diagnostics\n\nThis step only reads HA. Any approved Bluetooth service restart is recorded in the preceding step.\n\n```json\n'
            jq . "$RUNNER_TEMP/ha-health.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
