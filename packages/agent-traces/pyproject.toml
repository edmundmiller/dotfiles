[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-traces"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb",
  "letta-trajectory",
  "marimo",
  "pyarrow",
  "pyiceberg[pyarrow,sql-sqlite]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_traces*"]
